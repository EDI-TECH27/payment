<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confirmation de paiement</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 430px;
    padding: 40px 25px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.success-icon {
    font-size: 75px;
    margin-bottom: 20px;
}

h1 {
    color: #159447;
    font-size: 26px;
    margin-bottom: 15px;
}

.message {
    color: #555;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.status {
    background: #e8f8ee;
    color: #168743;
    padding: 13px;
    border-radius: 8px;
    font-weight: bold;
    margin-bottom: 25px;
}

.button {
    display: block;
    width: 100%;
    padding: 15px;
    background: #159447;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

.button:hover {
    background: #10783a;
}

.footer {
    color: #999;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="success-icon">✅</div>

    <h1>Payment successfully completed!</h1>

  

    <div class="status">
        ✓ Payment confirmed
    </div>

    <a href="index.html" class="button">
        Return to Homepage
    </a>

    <p class="footer">
        Confirmation de paiement
    </p>

</div>

</body>
</html>
